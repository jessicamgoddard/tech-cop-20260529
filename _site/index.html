<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Starter HTML page" />
  <title>Tech Cop</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/theme/material-darker.css" />
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/css/css.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5/addon/comment/comment.js"></script>
  <script src="./index.js" defer></script>
</head>

<body>
  <main class="deck">
    <section class="slide">
    <h2>Property: <code>text-*</code></h2>
    <p>Dress up text decorations.</p>
    <div class="code">
        <textarea spellcheck="false">
p {
    /* text-decoration: line, thickness, style, and color */
    text-decoration: underline 1px solid currentColor;
    /* text-decoration-line: overline; */
    /* text-decoration-thickness: 2px; */
    /* text-decoration-style: wavy; */
    /* text-decoration-color: red; */
    /* text-underline-offset: 4px; */
}
        </textarea>
    </div>
    <div class="demo">
        <p>This is a text decoration example.</p>
    </div>
</section>
    <section class="slide">
    <h2>Property: <code>aspect-ratio</code></h2>
    <p>Specify an aspect ratio instead of setting explicit width and height values.</p>
    <div class="code">
        <textarea spellcheck="false">
img {
aspect-ratio: 1;
aspect-ratio: 16 / 9;

/* -------------------------------- */
width: 500px;
}
        </textarea>
    </div>
    <div class="demo">
        <img src="../assets/purple-tree.jpg" alt="Purple tree" />
    </div>
</section>
  </main>
</body>

</html>
