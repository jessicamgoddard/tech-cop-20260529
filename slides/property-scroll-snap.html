<section class="slide">
    <h2>Property: scroll snap</h2>
    <p>Snap scroll positions to specific elements in a scrollable container.</p>
    <div class="code">
        <textarea spellcheck="false">
.scroller {
    scroll-snap-type: y mandatory;
    /* scroll-snap-type: y proximity; */
    scroll-padding-top: 0px;
    /* scroll-behavior: smooth; */
    overflow-y: scroll;
    height: 200px;
    border: 2px solid black;
}
.item {
    scroll-snap-align: start;
    /* scroll-snap-align: center; */
    /* scroll-snap-align: end; */
    scroll-margin-top: 0px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    font-weight: bold;
}
.item:nth-child(1) { background: lightblue; }
.item:nth-child(2) { background: lightgreen; }
.item:nth-child(3) { background: lightyellow; }
        </textarea>
    </div>
    <div class="demo">
        <div class="scroller">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
    </div>
</section>
