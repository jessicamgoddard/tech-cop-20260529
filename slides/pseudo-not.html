<section class="slide">
  <div class="slide-header">
    <h2>Pseudo-class: <code>:not()</code></h2>
    <p>Exclude elements from a selector.</p>
    <p>Modern <code>:not()</code> accepts selector lists; the old single-argument version could not. Avoids the common pattern of styling all items, then overriding the exceptions.</p>
  </div>
  <div class="code">
    <textarea spellcheck="false">
/* Every list item that does NOT have the class "first" */
/* li:not(.first) {
  color: hotpink;
} */

/* Every list item that is does NOT have the class "first" OR "second" */
/* li:not(.first, .second) {
  font-weight: bold;
} */

/* Every list item that is NOT the last child of its parent */
/* li:not(:last-child) {
  border-block-end: 1px solid silver;
  margin-block-end: 0.5rem;
  padding-block-end: 0.5rem;
} */
    </textarea>
  </div>
  <div class="demo">
    <ul>
      <li class="first">First item</li>
      <li class="second">Second item</li>
      <li class="third">Third item</li>
      <li class="last">Last item</li>
    </ul>
  </div>
</section>
