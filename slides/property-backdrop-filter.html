  <div class="slide-header">
    <h2>Property: <code>backdrop-filter</code></h2>
    <p>Apply graphical effects to the area behind an element.</p>
    <p>The element needs a semi-transparent background to reveal the effect; a fully opaque element just covers it.</p>
  </div>
  <div class="code">
    <textarea spellcheck="false">
.container {
  aspect-ratio: 4 / 3;
  background-image: url('assets/glasses.jpg');
  background-size: cover;
  inline-size: 100%;
  position: relative;
}

.overlay {
  /* backdrop-filter: blur(8px); */

  /* backdrop-filter: grayscale(1); */
  /* backdrop-filter: hue-rotate(90deg); */
  /* backdrop-filter: invert(); */
  /* backdrop-filter: sepia(100%); */
  /* backdrop-filter: saturate(80%); */
  /* backdrop-filter: blur(4px) brightness(0.8); */

  inset: 30px;
  position: absolute;
}
