<section class="slide">
  <div class="slide-header">
    <h2>Pseudo-class: <code>:is()</code> / <code>:where()</code></h2>
    <p><code>:is()</code> takes the specificity of its most specific argument; <code>:where()</code> always has zero specificity.</p>
  </div>
  <div class="code">
    <textarea spellcheck="false">
:is(h2, h3) {
  color: hotpink;
  /* specificity = (0,0,1) (matches highest arg) */
}
:where(p) {
  color: mediumpurple;
  /* specificity = (0,0,0) (always zero) */
}
.override {
  color: mediumturquoise;
  /* overrides :where(p) because (0,1,0) > (0,0,0) */
}
    </textarea>
  </div>
  <div class="demo">
    <h2>Styled with :is()</h2>
    <h3>Also :is()</h3>
    <p class="override">:where(p) purple, then overridden to teal</p>
    <p>Styled by :where(p)</p>
  </div>
</section>
