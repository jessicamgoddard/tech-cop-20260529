<section class="slide">
  <div class="slide-header">
    <h2>At-rule: <code>@property</code></h2>
    <p>Register a custom property with a type, initial value, and inheritance; enables animating custom properties.</p>
  </div>
  <div class="code">
    <textarea spellcheck="false">
@property --hue {
  inherits: false;
  initial-value: 0deg;
  syntax: '<angle>';
}
.box {
  --hue: 0deg;
  background: hsl(var(--hue), 70%, 60%);
  font-weight: bold;
  padding: 2rem;
  text-align: center;
  transition: --hue 0.6s;
  /* without @property, --hue can't be transitioned */
}
.box:hover {
  --hue: 200deg;
}
    </textarea>
  </div>
  <div class="demo">
    <div class="box">Hover me</div>
  </div>
</section>
