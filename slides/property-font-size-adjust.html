<section class="slide">
    <h2>Property: <code>font-size-adjust</code></h2>
    <p>Normalize the apparent size of text across different fonts by matching x-height.</p>
    <div class="code">
        <textarea spellcheck="false">
p {
    font-size: 24px;
    font-size-adjust: 0.5;
    /* font-size-adjust: none; */
    /* font-size-adjust: from-font; */
}
.verdana { font-family: Verdana, sans-serif; }
.times   { font-family: 'Times New Roman', serif; }
        </textarea>
    </div>
    <div class="demo">
        <p class="verdana">The quick brown fox jumps</p>
        <p class="times">The quick brown fox jumps</p>
    </div>
</section>
