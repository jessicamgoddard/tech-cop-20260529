    <h2>Pseudo-class: <code>:user-valid</code> / <code>:user-invalid</code></h2>
    <p>Validate only after user interaction; avoids error styles on untouched fields.</p>
    <p>Unlike <code>:invalid</code>, they don't fire on page load, so fields don't show red borders before anyone has typed anything.</p>
