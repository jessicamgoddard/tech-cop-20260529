<section class="slide">
    <h2>Pattern: center a shrink-wrapped element</h2>
    <p>Center an element without a hardcoded width using <code>fit-content</code> + <code>margin-inline: auto</code>.</p>
    <div class="code">
        <textarea spellcheck="false">
.box {
    width: fit-content;
    margin-inline: auto;
    /* old way: width: 200px; margin: 0 auto; */
    background: lightblue;
    padding: 1rem;
}
        </textarea>
    </div>
    <div class="demo">
        <div class="box">Centered to content width</div>
    </div>
</section>
