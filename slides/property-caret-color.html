    <p>A small finishing touch for on-brand form fields. Can also be set to <code>transparent</code> to hide the cursor entirely.</p>
  </div>
  <div class="code">
    <textarea spellcheck="false">
input {
  caret-color: auto;

  /* caret-color: transparent; */
  font-size: 2rem;
}
    </textarea>
  </div>
  <div class="demo">
    <input type="text" value="Click to focus me" />

</section>
