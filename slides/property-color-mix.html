<section class="slide">
  <div class="slide-header">
    <h2>Function: <code>color-mix()</code></h2>
    <p>Mix two or more colors.</p>
    <p>Mixing with <code>transparent</code> reduces a color's opacity without applying <code>opacity</code> to the element — text, borders, and child elements are unaffected.</p>
  </div>
  <div class="code">
    <textarea spellcheck="false">
button {
  background-color: hotpink;
  border: 2px solid hotpink;
  color: white;
  font-size: 2rem;
  padding: 0.5rem;
  cursor: pointer;
}

button:hover {
  /* background-color: color-mix(in srgb, hotpink 50%, transparent); */
  opacity: 0.5;
}
    </textarea>
  </div>
  <div class="demo">
    <button>Some text here</button>
  </div>
</section>
