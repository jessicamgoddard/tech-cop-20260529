<section class="slide">
  <div class="slide-header">
    <h2>Property: <code>place-*</code></h2>
    <p>Shorthand for <code>align-*</code> and <code>justify-*</code>; set both axes at once.</p>
  </div>
  <div class="code">
    <textarea spellcheck="false">
.grid {
  background: whitesmoke;
  display: grid;
  grid-template-columns: repeat(3, 60px);
  grid-template-rows: repeat(2, 60px);
  height: 220px;
  place-content: center;
  /* place-content: space-between end; */
  /* place-content: start; */
  place-items: center;
  /* place-items: stretch; */
  /* place-items: start end; */
}
.item {
  align-items: center;
  background: hotpink;
  color: white;
  display: flex;
  height: 40px;
  justify-content: center;
  width: 40px;
}
.special {
  background: mediumpurple;
  place-self: end start;
  /* place-self: center; */
}
    </textarea>
  </div>
  <div class="demo">
    <div class="grid">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item special">F</div>
    </div>
  </div>
</section>
