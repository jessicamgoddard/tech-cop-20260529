<section class="slide">
    <h2>Property: <code>transition-behavior: allow-discrete</code></h2>
    <p>Transition discrete properties like <code>display</code> — previously impossible without JS.</p>
    <div class="code">
        <textarea spellcheck="false">
.box {
    transition: display 0.4s allow-discrete, opacity 0.4s;
    /* transition-behavior: allow-discrete; — longhand form */
    /* @starting-style enables the enter animation */
    opacity: 1;
    padding: 1rem;
    background: hotpink;
    color: white;
    margin-block-start: 0.5rem;
}
input:not(:checked) ~ .box {
    display: none;
    opacity: 0;
}
        </textarea>
    </div>
    <div class="demo">
        <label><input type="checkbox" checked /> Toggle box</label>
        <div class="box">I fade out on hide</div>
    </div>
</section>
