<section class="slide">
    <h2>At-rule: <code>@container</code></h2>
    <p>Apply styles based on the container's size, not the viewport. Drag the container to resize.</p>
    <div class="code">
        <textarea spellcheck="false">
.container {
    container-type: inline-size;
    /* container-name: card-wrapper; */
    resize: horizontal;
    overflow: hidden;
    width: 400px;
    border: 2px dashed #ccc;
    padding: 0.5rem;
}
.card {
    background: lightblue;
    padding: 1rem;
    font-size: clamp(0.875rem, 5cqi, 1.5rem);
}
@container (min-width: 300px) {
    .card {
        background: hotpink;
        color: white;
    }
}
        </textarea>
    </div>
    <div class="demo">
        <div class="container">
            <div class="card">Card adapts to its container</div>
        </div>
    </div>
</section>
