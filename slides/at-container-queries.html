<section class="slide">
  <div class="slide-header">
    <h2>At-rule: <code>@container</code></h2>
    <p>Apply styles based on the container's size, not the viewport.</p>
    <p>Mark a parent with <code>container-type: inline-size</code>, then write <code>@container () {}</code> rules that respond to that parent's available width.</p>
  </div>
  <div class="code">
    <textarea spellcheck="false">
/* Identify the container */
.container {
  border: 2px dashed silver;
  container-type: inline-size;
  /* container-name: card-wrapper; */
  overflow: hidden;
  padding: 0.5rem;
  resize: horizontal;
  width: 400px;
}

.card {
  background: mediumturquoise;
  font-size: clamp(0.875rem, 5cqi, 1.5rem);
  padding: 1rem;
}
