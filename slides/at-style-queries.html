<section class="slide">
  <div class="slide-header">
    <h2>At-rule: style queries</h2>
    <p>Query a container's custom property values, not just its size.</p>
  </div>
  <div class="code">
    <textarea spellcheck="false">
.container {
  container-type: inline-size;
}
.container.primary   { --variant: primary; }
.container.secondary { --variant: secondary; }
.card {
  background: whitesmoke;
  padding: 1rem;
}
@container style(--variant: primary) {
  .card { background: hotpink; color: white; }
}
@container style(--variant: secondary) {
  .card { background: mediumpurple; color: white; }
}
    </textarea>
  </div>
  <div class="demo">
    <div class="container primary" style="margin-block-end: 0.5rem;">
      <div class="card">Primary variant</div>
    </div>
    <div class="container secondary">
      <div class="card">Secondary variant</div>
    </div>
  </div>
</section>
