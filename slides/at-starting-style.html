<section class="slide">
    <h2>At-rule: <code>@starting-style</code></h2>
    <p>Define initial styles for enter transitions — enables CSS-only enter animations. Requires <code>transition-behavior: allow-discrete</code>.</p>
    <div class="code">
        <textarea spellcheck="false">
.box {
    transition: display 0.4s allow-discrete, opacity 0.4s, translate 0.4s;
    opacity: 1;
    translate: 0 0;
    padding: 1rem;
    background: hotpink;
    color: white;
    margin-block-start: 0.5rem;
}
input:not(:checked) ~ .box {
    display: none;
    opacity: 0;
    translate: 0 -16px;
}
@starting-style {
    input:checked ~ .box {
        opacity: 0;
        translate: 0 -16px;
    }
}
        </textarea>
    </div>
    <div class="demo">
        <label><input type="checkbox" checked /> Toggle box</label>
        <div class="box">I animate in AND out</div>
    </div>
</section>
